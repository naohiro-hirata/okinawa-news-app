# ==========================================================
# 沖縄・全国 移住定住ニュース収集アプリ 設定ファイル
# キーワードやRSSフィードのURLはここを編集するだけで反映されます。
# ==========================================================

# Googleニュース検索に使うキーワード
# 各キーワードごとに「https://news.google.com/rss/search?q=キーワード」で検索します
# region: "沖縄" または "全国"（地域タブでの絞り込みに使用）
# category: "移住定住" "地域おこし" "その他" など（ジャンルタブでの絞り込みに使用）
# sub_category: categoryの下位分類。同じ意味系統のキーワードをまとめるラベルで、
#   3段目のタブ（ジャンルの選択に連動して選択肢が変わる）での絞り込みに使用します。
# exclude_domains: このキーワードで収集した記事のうち、出典サイトのドメイン名に
#   一致（部分一致）するものを除外したい場合に指定します（省略可）。
#   全キーワード共通で除外したいドメインがある場合は、ファイル末尾の
#   トップレベル exclude_domains リストに追加してください。
keywords:
  - keyword: "沖縄 移住"
    region: "沖縄"
    category: "移住定住"
    sub_category: "移住全般"
  - keyword: "沖縄 地域おこし"
    region: "沖縄"
    category: "地域おこし"
    sub_category: "地域おこし全般"
  - keyword: "移住定住 全国"
    region: "全国"
    category: "移住定住"
    sub_category: "移住全般"
  - keyword: "地域おこし協力隊"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域おこし協力隊"

  # --- 移住定住関連 ---
  - keyword: "沖縄 二地域居住"
    region: "沖縄"
    category: "移住定住"
    sub_category: "二地域居住"
  - keyword: "二地域居住"
    region: "全国"
    category: "移住定住"
    sub_category: "二地域居住"
  - keyword: "沖縄 関係人口"
    region: "沖縄"
    category: "移住定住"
    sub_category: "関係人口"
  - keyword: "関係人口"
    region: "全国"
    category: "移住定住"
    sub_category: "関係人口"
  - keyword: "ふるさと住民登録制度"
    region: "全国"
    category: "移住定住"
    sub_category: "ふるさと住民登録制度"
  - keyword: "ふるさとワーキングホリデー"
    region: "全国"
    category: "移住定住"
    sub_category: "ふるさとワーキングホリデー"
  - keyword: "沖縄 空き家バンク"
    region: "沖縄"
    category: "移住定住"
    sub_category: "空き家関連"
  - keyword: "空き家活用 移住"
    region: "全国"
    category: "移住定住"
    sub_category: "空き家関連"
  - keyword: "沖縄 空き家改修"
    region: "沖縄"
    category: "移住定住"
    sub_category: "空き家関連"
  - keyword: "沖縄 移住相談会"
    region: "沖縄"
    category: "移住定住"
    sub_category: "移住相談・支援金"
  - keyword: "沖縄 移住支援金"
    region: "沖縄"
    category: "移住定住"
    sub_category: "移住相談・支援金"
  - keyword: "沖縄島ぐらし"
    region: "沖縄"
    category: "移住定住"
    sub_category: "移住全般"

  # --- 地域おこし関連 ---
  - keyword: "地域プロジェクトマネージャー"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域支援専門人材制度"
  - keyword: "地域活性化起業人"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域支援専門人材制度"
  - keyword: "集落支援員"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域支援専門人材制度"
  - keyword: "特定地域づくり事業協同組合"
    region: "全国"
    category: "地域おこし"
    sub_category: "特定地域づくり事業協同組合"
  - keyword: "地域運営組織"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域運営組織"
  - keyword: "地域力創造アドバイザー"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域支援専門人材制度"
  - keyword: "地域おこし協力隊アドバイザー"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域おこし協力隊"
  - keyword: "起業型地域おこし協力隊"
    region: "全国"
    category: "地域おこし"
    sub_category: "地域おこし協力隊"
  - keyword: "沖縄 特定地域づくり事業協同組合"
    region: "沖縄"
    category: "地域おこし"
    sub_category: "特定地域づくり事業協同組合"
  - keyword: "沖縄 外部人材活用"
    region: "沖縄"
    category: "地域おこし"
    sub_category: "外部人材活用"
    exclude_domains:
      - "mbp-japan.com"
  - keyword: "過疎地域 コミュニティ再興"
    region: "全国"
    category: "地域おこし"
    sub_category: "過疎地域コミュニティ再興"

  # --- 人材確保関連（新カテゴリ） ---
  - keyword: "沖縄 離島 職員採用"
    region: "沖縄"
    category: "人材確保"
    sub_category: "自治体職員採用"
  - keyword: "沖縄 町村職員 採用試験"
    region: "沖縄"
    category: "人材確保"
    sub_category: "自治体職員採用"
  - keyword: "しまぐらし公務員"
    region: "沖縄"
    category: "人材確保"
    sub_category: "自治体職員採用"
  - keyword: "自治体 採用力向上"
    region: "全国"
    category: "人材確保"
    sub_category: "自治体人材確保施策"
  - keyword: "地方公務員 人材確保"
    region: "全国"
    category: "人材確保"
    sub_category: "自治体人材確保施策"

  # --- その他 ---
  - keyword: "集落点検"
    region: "全国"
    category: "その他"
    sub_category: "集落点検"
  - keyword: "自治会 担い手不足"
    region: "全国"
    category: "その他"
    sub_category: "自治会・担い手不足"
  - keyword: "中間支援組織"
    region: "全国"
    category: "その他"
    sub_category: "中間支援組織"
  - keyword: "沖縄 過疎地域 空き家対策"
    region: "沖縄"
    category: "その他"
    sub_category: "空き家対策"

# Googleニュース検索の言語・地域設定
google_news:
  hl: "ja"      # 表示言語
  gl: "JP"      # 国
  ceid: "JP:ja" # 国:言語

# 直接購読するRSSフィード（任意で追加・削除できます）
# ※ 琉球新報は現在RSS配信が見当たらなかったため未設定です。
#   見つかった場合はここに name/url を追加してください。
rss_feeds:
  - name: "沖縄タイムス"
    url: "https://www.okinawatimes.co.jp/list/feed/rss"

# 全キーワード共通で除外したい出典サイトのドメイン（部分一致・任意）
# 例: exclude_domains: ["example.com"]
exclude_domains: []

# 何日以内の記事を対象にするか（0にすると日付フィルタなし）
max_age_days: 30

# 出力するHTMLファイルのパス
output_file: "output/news.html"
